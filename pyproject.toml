[project]
name = "mlfastapi"
version = "0.1.0"
description = "Clasificador de Iris con FastAPI, Streamlit y MLflow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mlflow>=3.18",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]
